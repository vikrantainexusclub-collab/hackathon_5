<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INNOVIK JUNIOR HACKATHON 2026</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Loading Animation */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loader"></div>
    </div>

    <section id="home" class="hero">
        <div class="hero-content">
            <div class="cta-buttons">
                <a href="./junior_hackathon_2026.html" target="_blank" class="btn btn-primary magnetic">INNOVIK JUNIOR HACKATHON 2026
                    Future Innovators Challenge
                    Exclusively for School Students (Class X to XII)
                </a>
            </div>
           


            <!-- Countdown Timer -->
            <div class="countdown-container fade-in">
                <div class="countdown-item">
                    <span class="countdown-number" id="days">00</span>
                    <span class="countdown-label">Days</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="hours">00</span>
                    <span class="countdown-label">Hours</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="minutes">00</span>
                    <span class="countdown-label">Minutes</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="seconds">00</span>
                    <span class="countdown-label">Seconds</span>
                </div>
            </div>

            <div class="cta-buttons">
                <a href="" target="_blank" class="btn btn-primary magnetic">Remaining Time</a>
            </div>
            <div class="cta-buttons">
                <a href="https://forms.gle/nBespXoUn4PGBpcW9" target="_blank" class="btn btn-primary magnetic">Register
                    Now!</a>
            </div>
        </div>
    </section>
    
</body>

</html>
